services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aigov
      POSTGRES_USER: aigovadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigovadmin -d aigov"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - aigov-postgres-data:/var/lib/postgresql/data

volumes:
  aigov-postgres-data:
