services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aigov
      POSTGRES_USER: aigovadmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigovadmin -d aigov"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - aigov-postgres-data:/var/lib/postgresql/data

  governance-api:
    image: governance-api:local
    platform: linux/amd64
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://aigovadmin:${POSTGRES_PASSWORD}@postgres:5432/aigov?sslmode=disable"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  aigov-postgres-data:
